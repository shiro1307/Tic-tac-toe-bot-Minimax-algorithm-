<html>

<head>
    <title>Tic tac toe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>

    <div class="main">

        <b>Mini tic-tac-toe - Player V/S Bot</b><br>
        <a href="local.html">[Play Player V/S Player (Local)]</a>
        <p class="aside">By Shardul R.H.</p>

        <div class="board">

            <svg id="slashp" height="260" width="260">
                <line id="slash"
                      x1="10"
                      y1="10"
                      x2="400"
                      y2="400"
                      style="stroke:rgb(255, 255, 255);stroke-width:5px" />
            </svg>

            <div class="row">
                <button id="0"></button>
                <button id="1"></button>
                <button id="2"></button>
            </div>

            <div class="row">
                <button id="3"></button>
                <button id="4"></button>
                <button id="5"></button>
            </div>

            <div class="row">
                <button id="6"></button>
                <button id="7"></button>
                <button id="8"></button>
            </div>

        </div>

        <br>
        <b id="status">X plays first</b>
        <br><br>
        <button id="replay" class="normalbtn">Play again</button>

    </div>

    <script>

        var table = [0, 0, 0, 0, 0, 0, 0, 0, 0];
        var turn = 1;
        const move = new Audio('castle.mp3');
        const botmove = new Audio('move-self.mp3');
        const win = new Audio('capture.mp3');

        var botturn = 2;
        var notbotturn = [0, 2, 1][botturn];

        function emptySquares(t = table) {
            var e = 0;
            for (let i = 0; i < 9; i++) {
                if (t[i] == 0) {
                    e++;
                }
            }
            return e;
        }

        function refreshTable() {
            for (let i = 0; i < 9; i++) {
                var c = table[i];
                if (c == 0) {
                    c = "";
                }
                document.getElementById(i.toString()).textContent = c;
            }
        }

        function resetGame() {
            table = [0, 0, 0, 0, 0, 0, 0, 0, 0];
            turn = 1;
            document.getElementById("replay").style.display = "none";
            document.getElementById("slashp").style.display = "none";
            refreshTable();
            var c = [0, "", ""];
            c[notbotturn] = " (You)";
            c[botturn] = " (Bot)";
            document.getElementById("status").textContent =
                "X plays first" + c[turn];

            if (turn == botturn) {
                playbot();
            }
        }

        document.getElementById("replay").onclick = function () {
            resetGame();
        };

        // Rest of your original JS remains unchanged
        // (Minimax, turnManage, playbot, etc.)

        resetGame();

        for (let i = 0; i < 9; i++) {
            var block = document.getElementById(i.toString());
            block.onclick = function () {
                playturn(i);
            };
        }

    </script>

    <style>

        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: larger;
        }

        .main {
            padding: 15px;
            text-align: center;
        }

        .board {
            position: relative;
            display: inline-block;
        }

        .row {
            display: flex;
            justify-content: center;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .aside {
            font-size: small;
            color: rgb(164, 164, 164);
        }

        button {
            width: 80px;
            height: 80px;
            font-size: 60px;
            transition: all 0.5s;
            background-color: rgb(34, 147, 135);
            border: none;
            margin: 5px;
            border-radius: 10px;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .normalbtn {
            width: 230px;
            height: 35px;
            font-size: medium;
        }

        button:active {
            background-color: rgb(53, 70, 53);
        }

    </style>

</body>

</html>
